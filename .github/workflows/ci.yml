name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
      - name: Start local Supabase
        run: supabase start
      - name: PostgreSQL migrations and RLS tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/peoplepulse-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          VITE_READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then VITE_READY=1; break; fi
            sleep 1
          done
          if [ "$VITE_READY" -ne 1 ]; then cat /tmp/peoplepulse-vite.log; exit 1; fi
          npm run test:e2e
      - name: Production build
        run: npm run build
